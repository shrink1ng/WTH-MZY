<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WTH & MZY 's Romantic Space 🎀</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Fredoka', 'Noto Sans SC', sans-serif;
      background-color: #fff0f3;
      color: #4a3e3d;
    }
    
    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #ffe6ea; }
    ::-webkit-scrollbar-thumb { background: #ffb3c1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff758f; }

    /* 拍立得悬浮效果 */
    .polaroid-card {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .polaroid-card:hover {
      transform: translateY(-8px) rotate(0deg) scale(1.02) !important;
      box-shadow: 0 20px 25px -5px rgba(255, 182, 193, 0.4), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
    }

    /* Claude 极简风玻璃拟态 */
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 192, 203, 0.4);
    }

    /* 飘落爱心动画 */
    @keyframes floatHeart {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      animation: floatHeart 4s linear forwards;
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- 1. 登录拦截弹窗 -->
  <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-pink-100/90 backdrop-blur-md">
    <div class="glass-panel p-8 rounded-3xl max-w-md w-full mx-4 shadow-2xl text-center border-2 border-pink-300 relative">
      <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-20 h-20 bg-pink-400 rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-white">
        🎀
      </div>
      <h2 class="text-2xl font-bold text-pink-600 mt-6 mb-2">情侣专属小屋登录</h2>
      <p class="text-xs text-pink-400 mb-6">WTH & MZY 的私密记录空间</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="text-xs font-semibold text-pink-500 ml-1">账号</label>
          <input type="text" id="login-account" placeholder="请输入账号" class="w-full mt-1 px-4 py-3 rounded-2xl bg-pink-50/50 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 transition text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-pink-500 ml-1">密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" class="w-full mt-1 px-4 py-3 rounded-2xl bg-pink-50/50 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 transition text-sm">
        </div>
      </div>

      <button onclick="handleLogin()" class="w-full mt-6 py-3 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-semibold rounded-2xl shadow-lg shadow-pink-300/50 transition transform active:scale-95">
        解锁甜蜜空间 💕
      </button>
    </div>
  </div>

  <!-- 2. 主页面结构 (Claude 极简侧边栏 + 内容区) -->
  <div id="app-container" class="flex w-full h-full opacity-0 transition-opacity duration-500">
    
    <!-- 侧边栏 -->
    <aside class="w-64 glass-panel border-r border-pink-200/60 flex flex-col justify-between p-4 z-20">
      <div class="space-y-6">
        <!-- 侧边栏 Head -->
        <div class="flex items-center gap-3 px-2 py-3 bg-pink-100/50 rounded-2xl border border-pink-200/50">
          <div class="w-10 h-10 rounded-xl bg-pink-400 text-white flex items-center justify-center text-xl shadow">
            🐱
          </div>
          <div>
            <h1 class="font-bold text-sm text-pink-700">WTH ❤️ MZY</h1>
            <p class="text-[10px] text-pink-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> 云端已同步
            </p>
          </div>
        </div>

        <!-- 导航菜单 -->
        <nav class="space-y-1">
          <button onclick="switchTab('tab-timer')" id="btn-tab-timer" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-pink-600 bg-pink-100/80 transition">
            <i class="fa-solid fa-heart-pulse"></i> 纪念日时刻
          </button>
          <button onclick="switchTab('tab-photos')" id="btn-tab-photos" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-pink-400 hover:bg-pink-50 hover:text-pink-600 transition">
            <i class="fa-solid fa-camera-retro"></i> 拍立得照片墙
          </button>
          <button onclick="switchTab('tab-notes')" id="btn-tab-notes" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-pink-400 hover:bg-pink-50 hover:text-pink-600 transition">
            <i class="fa-solid fa-book-bookmark"></i> 甜蜜日记本
          </button>
          <button onclick="switchTab('tab-bucket')" id="btn-tab-bucket" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-pink-400 hover:bg-pink-50 hover:text-pink-600 transition">
            <i class="fa-solid fa-list-check"></i> 100件小事
          </button>
        </nav>
      </div>

      <!-- 退出登录 -->
      <button onclick="logout()" class="flex items-center gap-2 px-4 py-2 text-xs text-pink-400 hover:text-pink-600 hover:bg-pink-100/50 rounded-xl transition">
        <i class="fa-solid fa-right-from-bracket"></i> 退出账号
      </button>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 h-full overflow-y-auto p-8 relative">

      <!-- TAB 1: 计时器概览 -->
      <section id="tab-timer" class="tab-content max-w-4xl mx-auto space-y-6">
        <div class="glass-panel p-8 rounded-3xl text-center relative overflow-hidden shadow-xl border-2 border-pink-200">
          <div class="absolute -right-6 -bottom-6 text-9xl opacity-10 select-none">🎀</div>
          <p class="text-xs uppercase tracking-widest text-pink-400 font-bold mb-2">LOVE COUNTER</p>
          <h2 class="text-3xl font-bold text-pink-600 mb-6">我们在一起已经</h2>
          
          <!-- 动态时间组件 -->
          <div class="grid grid-cols-4 gap-4 max-w-lg mx-auto">
            <div class="bg-pink-50/80 p-4 rounded-2xl border border-pink-200">
              <span id="days" class="block text-3xl font-extrabold text-pink-500">0</span>
              <span class="text-xs text-pink-400">DAYS</span>
            </div>
            <div class="bg-pink-50/80 p-4 rounded-2xl border border-pink-200">
              <span id="hours" class="block text-3xl font-extrabold text-pink-500">0</span>
              <span class="text-xs text-pink-400">HOURS</span>
            </div>
            <div class="bg-pink-50/80 p-4 rounded-2xl border border-pink-200">
              <span id="minutes" class="block text-3xl font-extrabold text-pink-500">0</span>
              <span class="text-xs text-pink-400">MINS</span>
            </div>
            <div class="bg-pink-50/80 p-4 rounded-2xl border border-pink-200">
              <span id="seconds" class="block text-3xl font-extrabold text-pink-500">0</span>
              <span class="text-xs text-pink-400">SECS</span>
            </div>
          </div>

          <!-- 设置在一起的时间点 -->
          <div class="mt-8 flex items-center justify-center gap-2 text-xs text-pink-400">
            <span>纪念起点：</span>
            <input type="date" id="start-date" class="bg-white/80 border border-pink-200 rounded-lg px-2 py-1 focus:outline-none text-pink-600" onchange="updateStartDate(this.value)">
          </div>
        </div>
      </section>

      <!-- TAB 2: 拍立得照片墙 -->
      <section id="tab-photos" class="tab-content hidden max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xl font-bold text-pink-700">📸 钉在墙上的拍立得</h2>
            <p class="text-xs text-pink-400">记录属于我们的定格瞬间</p>
          </div>
          <button onclick="showUploadModal()" class="px-4 py-2 bg-pink-400 hover:bg-pink-500 text-white rounded-2xl shadow text-xs font-semibold flex items-center gap-2 transition">
            <i class="fa-solid fa-plus"></i> 添加新照片
          </button>
        </div>

        <!-- 照片卡片网格 -->
        <div id="photos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 pt-4">
          <!-- 动态渲染照片 -->
        </div>
      </section>

      <!-- TAB 3: 甜蜜日记本 -->
      <section id="tab-notes" class="tab-content hidden max-w-3xl mx-auto space-y-6">
        <div class="glass-panel p-6 rounded-3xl shadow-lg border border-pink-200">
          <h3 class="text-sm font-bold text-pink-600 mb-3"><i class="fa-solid fa-pen-nib"></i> 写下今天的小确幸</h3>
          <textarea id="note-input" rows="3" placeholder="记录今天发生的甜蜜趣事..." class="w-full p-4 rounded-2xl bg-pink-50/50 border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm resize-none"></textarea>
          <div class="flex justify-end mt-3">
            <button onclick="addNote()" class="px-5 py-2 bg-pink-400 hover:bg-pink-500 text-white rounded-xl text-xs font-semibold shadow transition">
              发布日记 💕
            </button>
          </div>
        </div>

        <div id="notes-list" class="space-y-4">
          <!-- 动态渲染日记 -->
        </div>
      </section>

      <!-- TAB 4: 100 件小事 -->
      <section id="tab-bucket" class="tab-content hidden max-w-3xl mx-auto space-y-6">
        <div class="glass-panel p-6 rounded-3xl shadow-lg border border-pink-200 flex justify-between items-center">
          <div>
            <h2 class="text-lg font-bold text-pink-700">💖 情侣必做的 100 件小事</h2>
            <p class="text-xs text-pink-400">打卡我们共同经历的所有美好</p>
          </div>
          <div class="text-right">
            <span id="bucket-progress-text" class="text-xl font-bold text-pink-500">0 / 0</span>
            <p class="text-[10px] text-pink-400">已完成打卡</p>
          </div>
        </div>

        <div id="bucket-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- 动态渲染清单 -->
        </div>
      </section>

    </main>
  </div>

  <!-- 上传照片 Modal -->
  <div id="photo-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="glass-panel p-6 rounded-3xl max-w-sm w-full mx-4 space-y-4">
      <h3 class="text-base font-bold text-pink-600">添加拍立得照片</h3>
      <div>
        <label class="text-xs text-pink-500">照片 URL 链接 / base64</label>
        <input type="text" id="photo-url" placeholder="https://..." class="w-full mt-1 p-3 rounded-xl border border-pink-200 text-xs focus:outline-none">
      </div>
      <div>
        <label class="text-xs text-pink-500">照片说明</label>
        <input type="text" id="photo-caption" placeholder="例如：在海边的告白" class="w-full mt-1 p-3 rounded-xl border border-pink-200 text-xs focus:outline-none">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closePhotoModal()" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-xs font-medium">取消</button>
        <button onclick="savePhoto()" class="flex-1 py-2 bg-pink-400 hover:bg-pink-500 text-white rounded-xl text-xs font-medium">保存照片</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Supabase 配置与初始化
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://dyotiyqvqwfgaxdrktwt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bNPfidm7HohmbXOy59z8vg_issqfro1";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 全局 State
    let loveData = {
      startDate: "2023-05-20",
      photos: [],
      notes: [],
      bucket: [
        { id: 1, text: "一起看一次日出与日落", done: false },
        { id: 2, text: "去一次迪士尼乐园", done: false },
        { id: 3, text: "一起做一顿丰盛的大餐", done: false },
        { id: 4, text: "去海边听海浪的声音", done: false },
        { id: 5, text: "一起拍一套情侣写真", done: false },
        { id: 6, text: "看一场浪漫的演唱会", done: false }
      ]
    };

    // -------------------------------------------------------------
    // 登录与初始化
    // -------------------------------------------------------------
    function handleLogin() {
      const acc = document.getElementById('login-account').value.trim();
      const pwd = document.getElementById('login-password').value.trim();

      if (acc === 'WTHMZY' && pwd === '1314') {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('app-container').classList.remove('opacity-0');
        initSpace();
      } else {
        alert('账号或密码不正确哦，请重试！');
      }
    }

    function logout() {
      document.getElementById('app-container').classList.add('opacity-0');
      document.getElementById('login-modal').classList.remove('hidden');
    }

    async function initSpace() {
      // 从 Supabase 拉取最新云端数据
      await fetchCloudData();
      
      // 初始化计时器
      document.getElementById('start-date').value = loveData.startDate;
      setInterval(calculateTime, 1000);
      calculateTime();

      // 渲染视图
      renderPhotos();
      renderNotes();
      renderBucket();
    }

    // -------------------------------------------------------------
    // Supabase 云端 CRUD
    // -------------------------------------------------------------
    async function fetchCloudData() {
      try {
        const { data, error } = await _supabase.from('love_data').select('*').eq('id', 'main_config').single();
        if (data && data.content) {
          loveData = data.content;
        } else {
          // 初始化写入一条数据
          await syncToCloud();
        }
      } catch (e) {
        console.warn("使用本地默认配置初始化", e);
      }
    }

    async function syncToCloud() {
      try {
        await _supabase.from('love_data').upsert({
          id: 'main_config',
          data_type: 'config',
          content: loveData
        });
      } catch (e) {
        console.error("云端同步失败:", e);
      }
    }

    // -------------------------------------------------------------
    // 计时器逻辑
    // -------------------------------------------------------------
    function calculateTime() {
      const start = new Date(loveData.startDate);
      const now = new Date();
      const diff = now - start;

      if (diff < 0) return;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').innerText = days;
      document.getElementById('hours').innerText = hours;
      document.getElementById('minutes').innerText = minutes;
      document.getElementById('seconds').innerText = seconds;
    }

    async function updateStartDate(val) {
      if (!val) return;
      loveData.startDate = val;
      calculateTime();
      await syncToCloud();
    }

    // -------------------------------------------------------------
    // 拍立得照片墙逻辑
    // -------------------------------------------------------------
    function showUploadModal() {
      document.getElementById('photo-modal').classList.remove('hidden');
    }
    function closePhotoModal() {
      document.getElementById('photo-modal').classList.add('hidden');
    }

    async function savePhoto() {
      const url = document.getElementById('photo-url').value.trim();
      const caption = document.getElementById('photo-caption').value.trim();

      if (!url) return alert('请输入照片 URL');

      const angles = [-3, -1.5, 1.5, 3];
      const randomAngle = angles[Math.floor(Math.random() * angles.length)];

      loveData.photos.unshift({
        id: Date.now().toString(),
        url,
        caption: caption || '我们的甜蜜瞬间',
        rotate: randomAngle,
        date: new Date().toLocaleDateString()
      });

      renderPhotos();
      closePhotoModal();
      document.getElementById('photo-url').value = '';
      document.getElementById('photo-caption').value = '';

      await syncToCloud();
    }

    async function deletePhoto(id) {
      if (confirm('确定要删除这张照片吗？')) {
        loveData.photos = loveData.photos.filter(p => p.id !== id);
        renderPhotos();
        await syncToCloud();
      }
    }

    function renderPhotos() {
      const container = document.getElementById('photos-grid');
      if (loveData.photos.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-pink-300 text-xs">暂无拍立得照片，点击右上角添加吧！</div>`;
        return;
      }

      container.innerHTML = loveData.photos.map(p => `
        <div class="polaroid-card bg-white p-3 rounded-md shadow-md border border-pink-100 relative group cursor-pointer" style="transform: rotate(${p.rotate || 0}deg)">
          <!-- 模拟胶带/图钉 -->
          <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-10 h-4 bg-pink-200/60 backdrop-blur-sm rounded-sm rotate-[-2deg]"></div>
          
          <div class="aspect-square bg-pink-50 overflow-hidden rounded mb-3">
            <img src="${p.url}" class="w-full h-full object-cover" loading="lazy" alt="photo">
          </div>
          <div class="flex justify-between items-end px-1">
            <div>
              <p class="text-xs font-semibold text-pink-700">${p.caption}</p>
              <p class="text-[10px] text-pink-300">${p.date}</p>
            </div>
            <button onclick="deletePhoto('${p.id}')" class="text-pink-300 hover:text-rose-500 text-xs opacity-0 group-hover:opacity-100 transition">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    // -------------------------------------------------------------
    // 日记本逻辑
    // -------------------------------------------------------------
    async function addNote() {
      const text = document.getElementById('note-input').value.trim();
      if (!text) return alert('请输入日记内容');

      loveData.notes.unshift({
        id: Date.now().toString(),
        content: text,
        date: new Date().toLocaleString()
      });

      renderNotes();
      document.getElementById('note-input').value = '';
      await syncToCloud();
    }

    async function deleteNote(id) {
      loveData.notes = loveData.notes.filter(n => n.id !== id);
      renderNotes();
      await syncToCloud();
    }

    function renderNotes() {
      const container = document.getElementById('notes-list');
      if (loveData.notes.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-pink-300 text-xs">还没有留下记录，快写下第一条甜蜜日记吧！</div>`;
        return;
      }

      container.innerHTML = loveData.notes.map(n => `
        <div class="glass-panel p-5 rounded-2xl shadow-sm border border-pink-100 relative group">
          <p class="text-xs text-pink-800 whitespace-pre-wrap leading-relaxed">${n.content}</p>
          <div class="flex justify-between items-center mt-3 pt-2 border-t border-pink-100/60">
            <span class="text-[10px] text-pink-400"><i class="fa-regular fa-clock"></i> ${n.date}</span>
            <button onclick="deleteNote('${n.id}')" class="text-pink-300 hover:text-rose-500 text-xs opacity-0 group-hover:opacity-100 transition">
              删除
            </button>
          </div>
        </div>
      `).join('');
    }

    // -------------------------------------------------------------
    // 100 件小事逻辑
    // -------------------------------------------------------------
    async function toggleBucket(id) {
      const item = loveData.bucket.find(b => b.id === id);
      if (item) {
        item.done = !item.done;
        renderBucket();
        await syncToCloud();
      }
    }

    function renderBucket() {
      const container = document.getElementById('bucket-list');
      const completedCount = loveData.bucket.filter(b => b.done).length;

      document.getElementById('bucket-progress-text').innerText = `${completedCount} / ${loveData.bucket.length}`;

      container.innerHTML = loveData.bucket.map(b => `
        <div onclick="toggleBucket(${b.id})" class="p-4 rounded-2xl border ${b.done ? 'bg-pink-100/60 border-pink-300 text-pink-800' : 'glass-panel border-pink-100 text-pink-600'} cursor-pointer flex items-center justify-between transition">
          <span class="text-xs font-medium ${b.done ? 'line-through opacity-70' : ''}">${b.id}. ${b.text}</span>
          <div class="w-5 h-5 rounded-full border border-pink-300 flex items-center justify-center ${b.done ? 'bg-pink-400 text-white' : ''}">
            ${b.done ? '✓' : ''}
          </div>
        </div>
      `).join('');
    }

    // -------------------------------------------------------------
    // Tab 切换逻辑
    // -------------------------------------------------------------
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-pink-100/80', 'text-pink-600');
        btn.classList.add('text-pink-400');
      });

      const activeBtn = document.getElementById(`btn-${tabId}`);
      activeBtn.classList.add('bg-pink-100/80', 'text-pink-600');
      activeBtn.classList.remove('text-pink-400');
    }
  </script>
</body>
</html>
